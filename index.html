<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>ENG_251885 APP — Kids Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ============================================================
     ENG_251885 APP — Design Tokens (Cyber-Minimalist High Contrast)
     ============================================================ */
  :root{
    --bg:#0D0D0D;
    --canvas:#1A1A1A;
    --canvas-raised:#212121;
    --accent:#4CAF50;
    --accent-dark:#357A38;
    --accent-soft:rgba(76,175,80,.14);
    --text-primary:#FFFFFF;
    --text-secondary:#AAAAAA;
    --danger:#E5484D;
    --radius-sm:12px;
    --radius-lg:16px;
    --font:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    user-select:none;
  }
  #app{
    min-height:100vh;
    padding-top:var(--safe-top);
    padding-bottom:calc(72px + var(--safe-bottom));
    display:flex;
    flex-direction:column;
  }
  button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
  input,select{font-family:inherit;}
  a{color:inherit;text-decoration:none;}
  ::-webkit-scrollbar{display:none;}

  /* ---------- Header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;gap:12px;
  }
  .logo-uploader{
    width:42px;height:42px;border-radius:50%;
    background:var(--canvas);
    display:flex;align-items:center;justify-content:center;
    border:1.5px dashed var(--text-secondary);
    font-size:18px;color:var(--text-secondary);
    flex-shrink:0;overflow:hidden;
  }
  .logo-uploader img{width:100%;height:100%;object-fit:cover;}

  .toggle-pill{
    flex:1;max-width:240px;margin:0 auto;
    display:flex;background:var(--canvas);
    border-radius:999px;padding:4px;position:relative;
  }
  .toggle-pill button{
    flex:1;padding:9px 0;border-radius:999px;
    font-size:13px;font-weight:600;color:var(--text-secondary);
    z-index:1;transition:color .25s ease;
    text-align:center;
  }
  .toggle-pill button.active{color:#06140a;}
  .toggle-pill .slider{
    position:absolute;top:4px;bottom:4px;left:4px;
    width:calc(50% - 4px);border-radius:999px;
    background:var(--accent);
    box-shadow:0 0 18px var(--accent-soft);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
  }
  .toggle-pill[data-active="products"] .slider{transform:translateX(100%);}

  .expand-icon{
    width:38px;height:38px;border-radius:var(--radius-sm);
    background:var(--canvas);display:flex;align-items:center;justify-content:center;
    flex-shrink:0;color:var(--text-secondary);font-size:16px;
  }

  /* ---------- Screen container ---------- */
  .screen{padding:4px 16px 24px;flex:1;}
  .screen[hidden]{display:none;}

  .section-title{
    font-size:13px;font-weight:700;letter-spacing:.04em;
    color:var(--text-secondary);text-transform:uppercase;
    margin:18px 2px 10px;
  }

  /* ---------- Category cards (Screen 1) ---------- */
  .category-card{
    background:var(--canvas);border-radius:var(--radius-lg);
    padding:16px;margin-bottom:14px;
    border:1px solid rgba(255,255,255,.04);
  }
  .category-card-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:12px;
  }
  .category-card-title{
    display:flex;align-items:center;gap:10px;
    font-size:16px;font-weight:700;
  }
  .category-icon{font-size:20px;}
  .category-count{
    background:var(--accent-soft);color:var(--accent);
    font-size:12px;font-weight:700;
    padding:4px 10px;border-radius:999px;
    font-variant-numeric:tabular-nums;
  }
  .subtag-row{
    display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;
    scroll-snap-type:x proximity;
  }
  .subtag-chip{
    flex-shrink:0;scroll-snap-align:start;
    background:var(--canvas-raised);
    border:1px solid rgba(255,255,255,.06);
    color:var(--text-secondary);
    font-size:12.5px;font-weight:600;
    padding:8px 14px;border-radius:999px;
    white-space:nowrap;transition:all .2s ease;
  }
  .subtag-chip:active{background:var(--accent);color:#06140a;border-color:var(--accent);}

  /* ---------- Products grid (Screen 2) ---------- */
  .search-row{
    display:flex;gap:8px;margin:8px 0 14px;
  }
  .search-box{
    flex:1;background:var(--canvas);border-radius:var(--radius-sm);
    padding:11px 14px;font-size:14px;color:var(--text-primary);
    border:1px solid rgba(255,255,255,.05);
  }
  .search-box::placeholder{color:var(--text-secondary);}
  .age-filter{
    background:var(--canvas);border-radius:var(--radius-sm);
    padding:11px 12px;font-size:13px;color:var(--text-secondary);
    border:1px solid rgba(255,255,255,.05);
    min-width:124px;
  }

  .product-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;
  }
  .product-card{
    background:var(--canvas);border-radius:var(--radius-lg);
    overflow:hidden;border:1px solid rgba(255,255,255,.04);
    display:flex;flex-direction:column;
  }
  .product-photo{
    aspect-ratio:1/1;background:linear-gradient(135deg,var(--canvas-raised),#161616);
    display:flex;align-items:center;justify-content:center;
    font-size:30px;color:var(--text-secondary);
  }
  .product-photo img{width:100%;height:100%;object-fit:cover;}
  .product-info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .product-title{font-size:13.5px;font-weight:600;line-height:1.3;}
  .product-age-tag{font-size:11px;color:var(--text-secondary);}
  .product-price{font-size:15px;font-weight:800;color:var(--accent);margin-top:2px;}
  .add-to-cart-btn{
    margin-top:8px;width:100%;padding:10px 0;
    background:var(--accent);color:#06140a;
    border-radius:10px;font-size:12.5px;font-weight:800;
    letter-spacing:.02em;
    transition:transform .15s ease, filter .15s ease;
  }
  .add-to-cart-btn:active{transform:scale(.96);filter:brightness(.92);}

  /* ---------- Dashboard (Screen 3) ---------- */
  .dash-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 16px;
  }
  .dash-title{font-size:19px;font-weight:800;}
  .dash-close{
    width:32px;height:32px;border-radius:50%;background:var(--canvas);
    display:flex;align-items:center;justify-content:center;font-size:15px;
    color:var(--text-secondary);
  }
  .welcome-text{font-size:14px;color:var(--text-secondary);margin-bottom:18px;}
  .welcome-text strong{color:var(--text-primary);}

  .stats-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;
  }
  .stat-card{
    background:var(--canvas);border-radius:var(--radius-lg);
    padding:14px;border:1px solid rgba(255,255,255,.04);
  }
  .stat-value{font-size:22px;font-weight:800;}
  .stat-label{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}

  .spend-banner{
    background:linear-gradient(120deg,var(--accent) 0%,var(--accent-dark) 100%);
    border-radius:var(--radius-lg);
    padding:18px 16px;margin-bottom:18px;
    box-shadow:0 8px 24px -8px var(--accent-soft);
  }
  .spend-label{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:rgba(6,20,10,.7);text-transform:uppercase;}
  .spend-value{font-size:26px;font-weight:900;color:#06140a;margin-top:4px;font-variant-numeric:tabular-nums;}

  .subtab-row{display:flex;gap:18px;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:14px;}
  .subtab{
    padding:8px 2px 12px;font-size:13.5px;font-weight:700;color:var(--text-secondary);
    position:relative;display:flex;align-items:center;gap:6px;
  }
  .subtab.active{color:var(--text-primary);}
  .subtab.active::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
    border-radius:2px;
  }
  .subtab-badge{
    background:var(--danger);color:#fff;font-size:10px;font-weight:800;
    min-width:16px;height:16px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
  }

  .order-card{
    background:var(--canvas);border-radius:var(--radius-lg);
    padding:14px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04);
  }
  .order-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .order-id{font-size:13.5px;font-weight:700;}
  .order-date{font-size:11.5px;color:var(--text-secondary);margin-top:2px;}
  .order-status{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;}
  .order-status.paid{background:var(--accent-soft);color:var(--accent);}
  .order-status.pending{background:rgba(170,170,170,.14);color:var(--text-secondary);}
  .order-status.failed{background:rgba(229,72,77,.14);color:var(--danger);}
  .order-action-btn{
    margin-top:10px;background:var(--accent);color:#06140a;
    font-size:12px;font-weight:800;padding:8px 14px;border-radius:9px;
  }
  .empty-state{
    text-align:center;padding:48px 20px;color:var(--text-secondary);font-size:13.5px;
  }

  /* ---------- Sticky tab bar ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;
    background:rgba(13,13,13,.92);backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,.06);
    display:flex;padding:8px 4px calc(8px + var(--safe-bottom));
    z-index:50;
  }
  .tab-item{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;color:var(--text-secondary);
    padding:4px 0;position:relative;
  }
  .tab-item.active{color:var(--accent);}
  .tab-icon{font-size:19px;}
  .tab-badge{
    position:absolute;top:-2px;right:22%;
    background:var(--danger);color:#fff;font-size:9px;font-weight:800;
    min-width:14px;height:14px;border-radius:7px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
  }

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--canvas-raised);border:1px solid var(--accent);
    color:var(--text-primary);font-size:13px;font-weight:600;
    padding:11px 18px;border-radius:999px;
    opacity:0;pointer-events:none;transition:all .25s ease;
    z-index:100;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------- Loading skeleton ---------- */
  .skeleton{background:linear-gradient(90deg,var(--canvas) 25%,var(--canvas-raised) 50%,var(--canvas) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:var(--radius-lg);}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="logo-uploader" id="logoUploader">🏪</div>
    <div class="toggle-pill" id="storeToggle" data-active="categories">
      <div class="slider"></div>
      <button data-mode="categories" class="active">Categories</button>
      <button data-mode="products">Products</button>
    </div>
    <button class="expand-icon" id="expandBtn">⤢</button>
  </header>

  <!-- SCREEN 1: Categories -->
  <section class="screen" id="screen-categories">
    <div id="categoryList">
      <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
      <div class="skeleton" style="height:140px;margin-bottom:14px;"></div>
      <div class="skeleton" style="height:140px;"></div>
    </div>
  </section>

  <!-- SCREEN 2: Products -->
  <section class="screen" id="screen-products" hidden>
    <div class="search-row">
      <input class="search-box" id="searchInput" type="text" placeholder="🔍 Search products...">
      <select class="age-filter" id="ageFilter">
        <option value="">All Ages (0-16Y)</option>
        <option value="1">0-2Y</option>
        <option value="4">3-5Y</option>
        <option value="7">6-8Y</option>
        <option value="10">9-10Y</option>
        <option value="13">11-13Y</option>
        <option value="15">14-16Y</option>
      </select>
    </div>
    <div class="product-grid" id="productGrid">
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
      <div class="skeleton" style="height:220px;"></div>
    </div>
  </section>

  <!-- SCREEN 3: Dashboard -->
  <section class="screen" id="screen-dashboard" hidden>
    <div class="dash-header">
      <div class="dash-title">My Dashboard</div>
      <button class="dash-close" id="dashCloseBtn">✕</button>
    </div>
    <div class="welcome-text">Welcome, <strong id="welcomeName">Guest</strong>!</div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-value" id="statOrders">—</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-value" id="statDownloads">—</div><div class="stat-label">Downloads</div></div>
      <div class="stat-card"><div class="stat-value" id="statKeys">—</div><div class="stat-label">Product Keys</div></div>
      <div class="stat-card"><div class="stat-value" id="statCompleted">—</div><div class="stat-label">Completed</div></div>
    </div>

    <div class="spend-banner">
      <div class="spend-label">Total Spent</div>
      <div class="spend-value" id="spendValue">$0.00</div>
    </div>

    <div class="subtab-row" id="dashSubtabs">
      <div class="subtab active" data-tab="downloads">📥 Downloads</div>
      <div class="subtab" data-tab="keys">🔑 Keys</div>
      <div class="subtab" data-tab="orders">📦 Orders <span class="subtab-badge" id="ordersBadge">0</span></div>
    </div>

    <div id="dashContent">
      <div class="empty-state">Loading your dashboard…</div>
    </div>
  </section>

  <nav class="tabbar">
    <button class="tab-item active" data-screen="categories"><span class="tab-icon">🏬</span>Store</button>
    <button class="tab-item" data-screen="cart"><span class="tab-icon">🛒</span>Cart</button>
    <button class="tab-item" data-screen="dashboard"><span class="tab-icon">📊</span>Dashboard<span class="tab-badge" id="cartBadge">0</span></button>
    <button class="tab-item" data-screen="news"><span class="tab-icon">📰</span>News</button>
    <button class="tab-item" data-screen="contact"><span class="tab-icon">✉️</span>Contact Us</button>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
